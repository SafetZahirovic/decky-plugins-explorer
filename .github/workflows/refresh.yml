name: Refresh plugin data

on:
  schedule:
    # GitHub Actions cron always runs in UTC, and there's no native timezone
    # support, so to land on 01:00 Europe/Oslo (CET/CEST) year-round we fire
    # at both possible UTC offsets and let the "Check local time" step below
    # skip the one that doesn't actually land on 01:00 local time.
    - cron: "0 0 * * *" # 01:00 CET (UTC+1, winter)
    - cron: "0 23 * * *" # 01:00 CEST (UTC+2, summer) - 23:00 UTC the day before
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the local-time gate and run immediately (uncheck to test that the gate correctly skips)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-plugin-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check local time
        id: gate
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force }}" = "true" ]; then
            echo "Manual run with force=true - bypassing the local-time gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Oslo date +%H)"
          if [ "$hour" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local Europe/Oslo time is ${hour}:00, not 01:00 - skipping (the other UTC-offset trigger will run instead)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Search, fetch, filter, and enrich
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_DATA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PLUGIN_DATA_TOKEN repo secret is not set. See README.md > 'Nightly refresh' for setup steps."
            exit 1
          fi
          python3 scripts/search_repos.py > repos.txt
          python3 scripts/fetch_data.py repos.txt data/plugins.json
          python3 scripts/filter_dataset.py data/plugins.json
          python3 scripts/fetch_releases.py data/plugins.json
          rm -f repos.txt

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly plugin data refresh"
            git push
          fi
